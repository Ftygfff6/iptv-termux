name: Build IPTV APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev libldns-dev
      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install Cython==0.29.36 buildozer
      - name: Install Android SDK Build-Tools manually
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.2
          ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
          export ANDROID_HOME
          # تنصيب حزم sdkmanager التلقائية وجلب الأدوات المطلوبة
          sdkmanager --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;33.0.2" "platform-tools"
      - name: Build with Buildozer
        run: |
          buildozer -v android debug
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
